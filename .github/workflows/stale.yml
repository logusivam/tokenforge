name: Close Stale Issues & Pull Requests

on:
  schedule:
    - cron: '30 1 * * *' # Run once a day at 01:30 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue is stale because it has been open 45 days with no activity. Remove stale label or comment, or this will be closed in 7 days.'
          stale-pr-message: 'This PR is stale because it has been open 45 days with no activity. Remove stale label or comment, or this will be closed in 7 days.'
          days-before-stale: 45
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'security,dependencies,pinned'
          exempt-pr-labels: 'dependencies,pinned'
