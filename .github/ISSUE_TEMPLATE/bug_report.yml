name: Bug Report
description: Report a bug or unexpected behaviour in TokenForge
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in all fields — incomplete reports will be closed.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Authentication (login / register)
        - Token Refresh / Rotation
        - OAuth2 (Google / GitHub)
        - RBAC / Permissions
        - Admin Panel
        - Frontend / UI
        - CI / CD / Deployment
        - Documentation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. POST /api/v1/auth/login with ...
        2. Then POST /api/v1/auth/refresh ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Node.js version:
        OS:
        Browser (if frontend):
        Deployment: local / Railway / other
    validations:
      required: true

  - type: checkboxes
    id: security
    attributes:
      label: Security Impact
      options:
        - label: This bug has a security implication (token bypass, privilege escalation, data leak)